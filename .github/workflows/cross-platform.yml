name: cross-platform

# The engine is meant to run on macOS, Linux and Windows. macOS and Linux were
# verified by hand; Windows never was, and the defects that only appear there
# (winerror vs errno, MoveFileExW semantics, reserved names) are exactly the ones
# that break data-safety promises. This workflow makes that gap impossible to
# ignore by running the same suite on all three platforms. The Swift app and
# the ops tooling are checked here too, so "all checks" covers every job.
# The full plan for test layers is docs/CI_TESTING.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to a PR replaces the older run, but every commit on main is
  # verified to the end: with several developers merging, cancelling on main
  # would leave commits (and release tags) that never got a complete run.
  group: cross-platform-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    env:
      COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
      CHAMO_COVERAGE_SOURCE: ${{ github.workspace }}/engine
      CHAMO_COVERAGE_DATA: ${{ github.workspace }}/build/coverage/.coverage
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Install pinned coverage reporter
        # CI-only tooling; do not add it to packaged engine dependencies.
        shell: bash
        run: python -m pip install coverage==7.10.6

      - name: Show renderer discovery
        shell: bash
        run: python engine/platform_office.py

      - name: Office conversion must run, not skip
        # Every platform in this matrix installs LibreOffice, and a broken discovery
        # made the Office test skip silently while the job stayed green. Assert on the
        # counts, not on a substring: "-k office" selects more than one test, so the
        # question is "did Office tests really pass here", not "is there a 1".
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          found=$(python engine/platform_office.py)
          echo "renderer: $found"
          case "$found" in
            *not\ found*) echo "LibreOffice is installed but the engine cannot find it"; exit 1;;
          esac
          python - <<'PY'
          import re, subprocess, sys
          # The named test, not "-k office": that also selects a naming test that never
          # converts anything, so the step could pass with the real one removed.
          run = subprocess.run([sys.executable, "-m", "pytest",
                                "tests/test_engine.py::test_office_render", "-q", "-rs"],
                               capture_output=True, text=True)
          print(run.stdout[-3000:])
          passed = int(re.search(r"(\d+) passed", run.stdout).group(1)) if re.search(r"(\d+) passed", run.stdout) else 0
          skipped = int(re.search(r"(\d+) skipped", run.stdout).group(1)) if re.search(r"(\d+) skipped", run.stdout) else 0
          if run.returncode or passed < 1 or skipped:
              print("Office conversion must run and pass here: passed=%d skipped=%d rc=%d"
                    % (passed, skipped, run.returncode))
              sys.exit(1)
          print("office tests passed: %d, skipped: %d" % (passed, skipped))
          PY

      - name: Probe the engine directly
        # A failing assertion in pytest only shows the assertion. When the engine
        # emits {"type":"fatal"} the reason lives in the event detail, so run one
        # request by hand and print every event before running the suite.
        #
        # PYTHONIOENCODING matters: this probe itself prints the engine's Chinese
        # paths, and a Windows console would raise UnicodeEncodeError here — which
        # is exactly how the first version of this step failed instead of the engine.
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from PIL import Image
          tmp = Path(tempfile.mkdtemp())
          src = tmp / "probe.png"
          Image.new("RGB", (8, 8), "blue").save(src)
          req = tmp / "request.json"
          req.write_text(json.dumps({"inputs": [str(src)], "output": str(tmp / "out"),
                                     "config": {"operation": "image_convert",
                                                "format": "png", "quality": 90}}),
                         encoding="utf-8")
          proc = subprocess.run([sys.executable, "-I", "engine/workbench.py",
                                 "--request", str(req)],
                                capture_output=True, text=True, encoding="utf-8")
          print("returncode:", proc.returncode)
          for line in proc.stdout.splitlines():
              print("EVENT", line)
          print("STDERR", proc.stderr[-2000:])
          PY

      - name: Run engine suite
        shell: bash
        # PYTHONIOENCODING keeps pytest's own output (which contains Chinese test
        # names and paths) from hitting the Windows console code page.
        env:
          PYTHONIOENCODING: utf-8
        # pipefail: without it a failing pytest piped into tee exits 0 and the job
        # goes green regardless. The exit code is asserted explicitly below.
        run: |
          set -o pipefail
          python -m coverage run -m pytest tests -q -rs -x --tb=short --junitxml=pytest-results.xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "pytest exit: $status"
          exit $status

      - name: Check skips and write the summary
        # A skip on the platform a test exists for looks like a pass in the exit
        # code. scripts/ci_report.py fails the job on any skip not registered for
        # this platform in tests/ci_allowed_skips.json, and writes the job summary.
        if: always()
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_report.py --platform ${{ matrix.label }} --skips tests/ci_allowed_skips.json --title "engine (${{ matrix.os }})" pytest-results.xml

      - name: Collect observed engine line and branch coverage
        # No percentage gate. Failure here cannot turn a failed test/skip gate green.
        # Data is partial if -x stopped early or a child was killed before flushing.
        if: always()
        shell: bash
        run: |
          python -m coverage combine --keep
          python -m coverage report | tee build/coverage/summary.txt
          python -m coverage xml
          python -m coverage json
          python -m coverage html
          {
            echo '### Observed Python engine coverage (report only)'
            echo 'Not exhaustive: excludes Swift/UI/package jobs; killed, os._exit or exec children can lose data. Review must assess functional gaps.'
            echo '```text'
            cat build/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.label }}
          path: build/coverage/
          if-no-files-found: warn

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.label }}
          path: |
            pytest.log
            pytest-results.xml
          if-no-files-found: ignore

  package:
    name: linux package
    runs-on: ubuntu-latest
    # The artifact users install must be built and installed for real. A green
    # source-tree test says nothing about whether the .deb installs or whether the
    # bundled wheels are complete, so this job builds the package, installs it, and
    # converts with it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the .deb
        run: |
          python -m pip install --quiet --upgrade pip
          python scripts/build_linux.py --out dist

      - name: Install and convert with it
        # CHAMO_ROOT: verify_deb.sh defaults to /w because the Docker wrapper mounts
        # the checkout there. On a runner the checkout is the workspace, and without
        # this every fixture path resolves to a missing file — which is exactly how
        # the first CI run failed: every conversion exited 2 (bad input).
        # PYTHONIOENCODING: the probe prints Chinese paths and the runner locale is
        # not guaranteed to be UTF-8.
        env:
          CHAMO_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          sudo dpkg -i dist/chamo-cli_*.deb
          # LibreOffice is a Recommends, so install it explicitly: Office
          # conversion must be exercised, not skipped.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-core libreoffice-impress libreoffice-writer fonts-noto-cjk || true
          bash scripts/verify_deb.sh 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload package and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            dist/*.deb
            verify.log
          if-no-files-found: warn


  windows-package:
    name: windows package
    runs-on: windows-latest
    # Windows has never had a distributable artifact. The package can only be built
    # and verified on Windows: it embeds the Windows embeddable CPython and native
    # win_amd64 wheels, neither of which can be produced meaningfully elsewhere.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the portable package
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet --upgrade pip
          python scripts/build_windows.py --out dist

      - name: Install LibreOffice
        # The portable package does not bundle LibreOffice. Installing it on the runner
        # is what makes the "already installed, so it must be discovered and used" path
        # real; without it this job only ever proved the missing-renderer degrade path.
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress
          $exe = Get-ChildItem "C:\Program Files\LibreOffice\program\soffice.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "LibreOffice install did not produce soffice.exe" }

      - name: Extract and convert with it
        # The verification runs under the package interpreter, so a missing bundled
        # wheel fails here instead of on a user machine.
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/chamo-cli_*.zip | Select-Object -First 1
          Write-Host "extracting $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath dist/extracted -Force
          $pkg = "dist/extracted/chamo"
          & "$pkg/python/python.exe" scripts/verify_windows.py --package $pkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Drive the packaged UI
        # The page is served by the packaged interpreter, so a missing wheel in the
        # ZIP breaks it here, not on a user's machine. Two launches: --package goes
        # straight to the interpreter (bundled runtime, no cmd.exe in between), and
        # --chamo uses the .cmd wrapper the user guide tells Windows users to run, so a
        # broken launcher cannot ship while the interpreter path still passes.
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $pkg = "dist/extracted/chamo"
          & "$pkg/python/python.exe" scripts/verify_ui.py --package $pkg --work dist/ui-accept
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pkg/python/python.exe" scripts/verify_ui.py --chamo "$pkg/chamo.cmd" --work dist/ui-accept-cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: warn

  swift:
    name: swift (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Build the app (release and debug-hook variants)
        # Same sources and frameworks as scripts/build_app.py; -Onone keeps it quick.
        # The CHAMO_DEBUG variant is built too because the GUI checks depend on it.
        run: |
          set -euo pipefail
          mkdir -p build/ci
          ui=$(ls Sources/*.swift | grep -v ImageDecode.swift)
          fw="-framework SwiftUI -framework AppKit -framework PDFKit -framework UniformTypeIdentifiers -framework ImageIO -framework QuickLookThumbnailing -framework Quartz -framework UserNotifications"
          for flags in "" "-D CHAMO_DEBUG"; do
            # shellcheck disable=SC2086
            swiftc -swift-version 5 -parse-as-library -Onone -module-cache-path build/ci/mc \
              -target arm64-apple-macosx15.0 $flags $ui -o build/ci/Chamo $fw
            echo "built with flags: [$flags]"
          done
          swiftc -module-cache-path build/ci/mc -target arm64-apple-macosx15.0 \
            Sources/ImageDecode.swift -o build/ci/dwnative -framework ImageIO -framework UniformTypeIdentifiers

      - name: Swift tests
        run: |
          set -euo pipefail
          swiftc -module-cache-path build/ci/mc -parse-as-library \
            Sources/GitHubFeedback.swift tests/FeedbackTests.swift -o build/ci/feedback-tests
          build/ci/feedback-tests
          swiftc -module-cache-path build/ci/mc -parse-as-library \
            Sources/GitHubFeedback.swift Sources/UpdateCheck.swift tests/UpdateTests.swift -o build/ci/update-tests
          build/ci/update-tests

  ops:
    name: ops scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR-first proposal catalog
        run: python scripts/check_proposals.py

      - name: Proposal schema and conflict tests
        run: python -m unittest discover -s tests -p test_proposals.py -v

      - name: Privacy and review API tests
        run: |
          python -m pip install pytest==9.1.1
          python -m pytest scripts/ci -q -rs

      - name: Shell scripts
        run: |
          shellcheck -x scripts/ci/*.sh scripts/ci/hooks/pre-push
          for f in scripts/ci/*.sh; do bash -n "$f"; done

  ui:
    name: ui (${{ matrix.os }})
    # Interface tests with a real browser on all three systems, and the real macOS
    # app driven by its debug scenario hooks. Plan and conventions: uitests/README.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows
          - os: macos-15
            label: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      CHAMO_UI_ARTIFACTS: ${{ github.workspace }}/build/ui-artifacts
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-engine

      - name: Install the browser test tools
        shell: bash
        run: |
          python -m pip install -r uitests/requirements.txt
          if [ "$RUNNER_OS" = Linux ]; then python -m playwright install --with-deps chromium
          else python -m playwright install chromium; fi

      - name: Browser UI
        shell: bash
        run: python -m pytest uitests/browser -q -rs --tb=short --junitxml=ui-browser.xml

      - name: Build the debug macOS app
        # Runs even when the browser tests failed, so one run reports both layers.
        if: runner.os == 'macOS' && !cancelled()
        run: python scripts/build_dev_app.py --out build/dev --python-prefix "$(python -c 'import sys; print(sys.prefix)')"

      - name: macOS app scenarios
        # Runs even when the browser tests failed, so one run reports both layers.
        if: runner.os == 'macOS' && !cancelled()
        run: python -m pytest uitests/macos -q -rs --tb=short --junitxml=ui-macos.xml

      - name: Judge the runs
        if: always()
        shell: bash
        run: python scripts/ci_report.py --platform ${{ matrix.label }} --skips tests/ci_allowed_skips.json --title "ui (${{ matrix.os }})" ui-*.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.label }}
          path: |
            build/ui-artifacts
            ui-*.xml
          if-no-files-found: warn

  all-checks:
    name: all checks
    # The one check branch protection requires. Adding or renaming a job above
    # then needs no change to the protection rule, and a skipped or cancelled job
    # counts as a failure here instead of silently not being required.
    if: always()
    needs: [engine, package, windows-package, swift, ops, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] != "success"}
          print("not successful:", bad) if bad else print("all jobs succeeded")
          sys.exit(1 if bad else 0)'
