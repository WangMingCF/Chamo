name: release

# Builds every distributable from a clean runner, verifies each one the way a
# user would get it (install or mount, launch, convert), and only then creates a
# DRAFT GitHub Release with the assets and SHA256SUMS.txt. DSH verifies the
# candidate, obtains required Mac evidence, then publishes the verified draft.
#
# Triggers:
#   * a tag v<version> matching config/release.json  -> build, verify, draft release
#   * a PR that touches the release pipeline           -> build and verify only
#   * workflow_dispatch with a tag                     -> build that tag with this
#     (default-branch) workflow, verify, and create or refresh its draft release;
#     without a tag: build and verify the default branch only
#
# Not done here (and never claimed): Developer ID signing and notarization. The
# app stays ad-hoc signed, the Windows ZIP unsigned; the draft notes say so.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bootstrap_dependencies.py
      - scripts/build_app.py
      - scripts/package_dmg.py
      - scripts/packaged_smoke.py
      - scripts/prune_python.py
      - scripts/prune_runtime.py
      - scripts/restore_libreoffice.py
      - scripts/build_linux.py
      - scripts/build_windows.py
      - scripts/collect_sources.py
      - scripts/ci/privacy_scan.py
      - third_party/dependencies.json
      - third_party/requirements.lock
  workflow_dispatch:
    inputs:
      tag:
        description: "existing version tag to build and draft (e.g. v0.1.0); empty = verify only"
        type: string
        default: ""

permissions:
  contents: read

env:
  # The code to build: the dispatched tag, or whatever triggered the run.
  BUILD_REF: ${{ inputs.tag || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - id: v
        name: Tag, config and docs agree
        run: |
          version=$(python3 -c 'import json; print(json.load(open("config/release.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "tag $RELEASE_TAG does not match config/release.json version $version"; exit 1
          fi
          python3 scripts/verify_docs_version.py

  macos:
    name: macOS DMG
    needs: check
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Cache pinned downloads
        # Keyed on the pin file: a changed URL or hash always downloads again,
        # and bootstrap_dependencies.py re-checks every SHA-256 either way.
        uses: actions/cache@v4
        with:
          path: third_party/downloads
          key: deps-${{ hashFiles('third_party/dependencies.json') }}

      - name: Fetch and verify the bundled runtime
        run: python3 scripts/bootstrap_dependencies.py

      - name: Build the app
        run: python3 scripts/build_app.py

      - name: Collect third-party source archives
        # Ships in the DMG as ThirdPartySources (license compliance): sdists and
        # an index for exactly the packages the bundled interpreter carries.
        run: third_party/python/bin/python3 scripts/collect_sources.py

      - name: Package the DMG
        run: python3 scripts/package_dmg.py

      - name: Install from the DMG and convert with it
        # The user's path: mount read-only, copy the app out, run it from there.
        run: |
          set -euo pipefail
          dmg=$(ls release/Chamo-*-AppleSilicon.dmg)
          mount="$RUNNER_TEMP/dmg"; install="$RUNNER_TEMP/Applications"
          mkdir -p "$mount" "$install"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          ditto "$mount/Chamo.app" "$install/Chamo.app"
          ls "$mount"
          hdiutil detach "$mount"
          codesign --verify --deep --strict "$install/Chamo.app"
          python3 scripts/packaged_smoke.py "$install/Chamo.app"
          echo "INSTALLED_APP=$install/Chamo.app" >> "$GITHUB_ENV"

      - name: No build-machine paths inside the app
        # Compiled bytecode once embedded the builder's home folder. The runner's
        # workspace must not appear anywhere in the installed bundle.
        run: |
          if grep -rl -F "$GITHUB_WORKSPACE" "$INSTALLED_APP" | head -5 | grep .; then
            echo "the bundle contains the build path $GITHUB_WORKSPACE"; exit 1
          fi
          echo "no build path found"

      - name: Privacy scan of the bundle's own text
        # Hash-based scan (scripts/ci/privacy_scan.py) over what the project
        # wrote: plist, engine, documentation. Third-party binaries are skipped.
        env:
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: |
          if [ -z "$PRIVACY_KEYWORDS" ]; then
            if [ -n "$RELEASE_TAG" ]; then echo "PRIVACY_KEYWORDS is required for a release"; exit 1; fi
            echo "::warning::PRIVACY_KEYWORDS not available here (fork or dry run); scan skipped"; exit 0
          fi
          printf '%s\n' "$PRIVACY_KEYWORDS" > "$RUNNER_TEMP/kw.txt"
          python3 scripts/ci/privacy_scan.py --keywords "$RUNNER_TEMP/kw.txt" files \
            "$INSTALLED_APP/Contents/Info.plist" "$INSTALLED_APP/Contents/Resources/engine" \
            "$INSTALLED_APP/Contents/Resources/Documentation"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: release/Chamo-*-AppleSilicon.dmg
          if-no-files-found: error

  linux:
    name: Linux deb (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the .deb
        run: python scripts/build_linux.py --out dist
      - name: Install and convert with it
        env:
          CHAMO_ROOT: ${{ github.workspace }}
          PYTHONIOENCODING: utf-8
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          sudo dpkg -i dist/chamo-cli_*.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-core libreoffice-impress libreoffice-writer fonts-noto-cjk
          bash scripts/verify_deb.sh
      - name: Scan installed Linux project files
        env:
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: |
          if [ -z "$PRIVACY_KEYWORDS" ]; then
            [ -z "$RELEASE_TAG" ] || { echo "Privacy configuration required"; exit 1; }
            echo "::warning::No privacy configuration on verification-only run"; exit 0
          fi
          printf '%s\n' "$PRIVACY_KEYWORDS" > "$RUNNER_TEMP/kw.txt"
          dpkg-deb -e dist/chamo-cli_*.deb "$RUNNER_TEMP/package-control"
          python scripts/ci/privacy_scan.py --keywords "$RUNNER_TEMP/kw.txt" files \
            /opt/chamo/engine /usr/share/doc/chamo-cli /usr/bin/chamo "$RUNNER_TEMP/package-control"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/chamo-cli_*.deb
          if-no-files-found: error

  windows:
    name: Windows ZIP
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the portable package
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build_windows.py --out dist
      - name: Install LibreOffice
        shell: pwsh
        run: choco install libreoffice-fresh -y --no-progress
      - name: Extract and convert with it
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/chamo-cli_*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/extracted -Force
          $pkg = "dist/extracted/chamo"
          & "$pkg/python/python.exe" scripts/verify_windows.py --package $pkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$pkg/python/python.exe" scripts/verify_ui.py --chamo "$pkg/chamo.cmd" --work dist/ui-accept
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan extracted Windows project files
        shell: python
        env:
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: |
          import os, pathlib, subprocess, sys
          value = os.environ.get('PRIVACY_KEYWORDS', '')
          if not value:
              if os.environ.get('RELEASE_TAG'): raise SystemExit('Privacy configuration required')
              print('::warning::No privacy configuration on verification-only run')
              sys.exit(0)
          keywords = pathlib.Path(os.environ['RUNNER_TEMP']) / 'kw.txt'
          keywords.write_text(value)
          package = pathlib.Path('dist/extracted/chamo')
          files = [package / 'engine', *[p for p in package.iterdir() if p.is_file()]]
          subprocess.run([sys.executable, 'scripts/ci/privacy_scan.py', '--keywords', str(keywords),
                          'files', *map(str, files)], check=True)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/chamo-cli_*.zip
          if-no-files-found: error

  draft:
    name: draft release
    # Only a version tag creates or refreshes a release; PRs and untagged manual
    # runs stop after verifying.
    if: (github.ref_type == 'tag' || inputs.tag != '') && !cancelled() && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [check, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          # Not "assets": the checkout has its own assets/ (brand files), and
          # mixing them in once put the logo folder into the release.
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd release-assets
          ls -la
          for f in *; do [ -f "$f" ] || { echo "unexpected entry $f"; exit 1; }; done
          sha256sum * | tee SHA256SUMS.txt
      - name: Privacy scan of asset names and notes
        env:
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: |
          [ -n "$PRIVACY_KEYWORDS" ] || { echo "PRIVACY_KEYWORDS is required for a release"; exit 1; }
          printf '%s\n' "$PRIVACY_KEYWORDS" > "$RUNNER_TEMP/kw.txt"
          # The packages' own text was scanned in their build jobs and in review;
          # here: asset names, the file lists inside them, and the notes.
          { ls release-assets; unzip -Z1 release-assets/*.zip; for d in release-assets/*.deb; do dpkg-deb -c "$d"; done; cat docs/RELEASE_NOTES.txt; } \
            | python3 scripts/ci/privacy_scan.py --keywords "$RUNNER_TEMP/kw.txt" text
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          {
            cat docs/RELEASE_NOTES.txt
            echo
            echo "---"
            echo "校验：下载后用 SHA256SUMS.txt 核对（shasum -a 256 -c SHA256SUMS.txt）。"
            echo "签名：macOS 版为 ad-hoc 签名，未经 Developer ID 签名与 Apple 公证；Windows 便携包未签名。"
          } > notes.md
          # Refresh an existing draft (e.g. after a failed upload) instead of
          # failing; a release that is already published is never touched.
          if gh release view "v$VERSION" --json isDraft -q .isDraft > state.txt 2>/dev/null; then
            [ "$(cat state.txt)" = true ] || { echo "v$VERSION is already published; not modifying it"; exit 1; }
            gh release upload "v$VERSION" release-assets/* --clobber
            gh release edit "v$VERSION" --title "Chamo $VERSION" --notes-file notes.md
            # Drop assets that are no longer part of the build (left by a broken run).
            keep=$(cd release-assets && ls)
            gh release view "v$VERSION" --json assets -q '.assets[].name' | while read -r name; do
              printf '%s\n' "$keep" | grep -qxF "$name" || gh release delete-asset "v$VERSION" "$name" -y
            done
          else
            gh release create "v$VERSION" release-assets/* --draft --verify-tag \
              --title "Chamo $VERSION" --notes-file notes.md
          fi
