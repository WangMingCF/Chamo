name: agent-review

# Independent review of every PR from a branch of this repository, run on
# GitHub so the development agent (in a container with no test or review
# ability of its own) never reviews itself.
#
# Safety:
#   * pull_request_target runs this file and the scripts as they are on the
#     base branch; the PR cannot change its own reviewer. The PR's code is never
#     checked out or executed: only its diff is read through the API.
#   * The verdict is the commit status "agent-review" on the PR's head commit.
#     The development token has no Commit statuses permission, so only this
#     workflow (or the maintainer, via scripts/ci/approve_pr.sh) can set it.
#   * Fork PRs are not reviewed: their text never reaches the model. They stay
#     blocked until the maintainer looks at them.
#   * Protected paths, oversized diffs and privacy hits are refused before any
#     model call.
#
# Configuration (Settings → Secrets and variables → Actions):
#   secrets   REVIEW_API_KEY      model API key
#             PRIVACY_KEYWORDS    contents of the hashed keyword file (required:
#                                 without it every review fails closed)
#             REVIEW_API_BASE     optional, default https://api.deepseek.com; a secret,
#                                 not a variable, so the endpoint is masked in the
#                                 public run logs
#   variables REVIEW_MODEL        model name
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review again"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      CONTEXT: agent-review
      PROTECTED: '^(ops/agent-loop/|scripts/ci/|\.github/|LICENSE|docs/LICENSES\.txt|engine/THIRD_PARTY_NOTICES\.md)'
      MAX_DIFF_BYTES: "400000"
    steps:
      - name: Check out the base branch (reviewer scripts only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_API_BASE: ${{ secrets.REVIEW_API_BASE }}
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
        run: |
          set -uo pipefail
          work=$(mktemp -d)
          pr_json=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid,isCrossRepository,title,body)
          sha=$(jq -r .headRefOid <<< "$pr_json")
          if [ "$(jq -r .isCrossRepository <<< "$pr_json")" = true ]; then
            echo "fork PR: not reviewed"; exit 0
          fi
          status() {  # status STATE DESCRIPTION
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$1" -f context="$CONTEXT" \
              -f description="${2:0:139}" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
            echo "agent-review: $1 — $2"
          }
          comment() { gh pr comment "$PR" -R "$GITHUB_REPOSITORY" -F "$1" > /dev/null; }
          # A maintainer release of this exact commit (scripts/ci/approve_pr.sh)
          # is final. A review run that finishes later must not overwrite it.
          released=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses" \
            --jq '[.[] | select(.context == "agent-review" and .state == "success" and (.description | startswith("维护者")))] | length')
          if [ "${released:-0}" != 0 ]; then
            echo "this commit was released by the maintainer; leaving the status as is"; exit 0
          fi
          status pending "评审中"

          if [ -z "$PRIVACY_KEYWORDS" ]; then
            status error "未配置 PRIVACY_KEYWORDS，评审拒绝放行"; exit 1
          fi
          printf '%s\n' "$PRIVACY_KEYWORDS" > "$work/keywords.txt"
          scan() { python3 scripts/ci/privacy_scan.py --keywords "$work/keywords.txt" text; }

          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only > "$work/files.txt" || { status error "无法读取改动文件"; exit 1; }
          if grep -Eq "$PROTECTED" "$work/files.txt"; then
            { echo "这个 PR 改动了受保护路径（CI 工具、工作流、许可证），自动评审不放行，需要维护者亲自审核；确认后由维护者运行 \`scripts/ci/approve_pr.sh $PR\`。"
              echo; echo "受保护文件："; grep -E "$PROTECTED" "$work/files.txt" | sed 's/^/- /'; } > "$work/c.md"
            comment "$work/c.md"; status failure "改动受保护路径，需要维护者亲自审核"; exit 0
          fi

          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > "$work/diff.patch" || { status error "无法读取 diff"; exit 1; }
          if [ "$(wc -c < "$work/diff.patch")" -gt "$MAX_DIFF_BYTES" ]; then
            status failure "diff 过大，请拆成更聚焦的 PR"; exit 0
          fi
          # Server-side privacy gate: catches what a skipped pre-push hook would have.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate \
            --jq '.[] | [.commit.author.name + " <" + .commit.author.email + ">", .commit.committer.name + " <" + .commit.committer.email + ">"] | .[]' \
            | sort -u > "$work/identities.txt"
          # The agent commits as DeepSeek Harness; Chamo is the maintainer-side
          # identity used before the agent existed. Neither carries personal data.
          if grep -vxF -e 'DeepSeek Harness <dsh@chamo.invalid>' -e 'Chamo <dev@chamo.invalid>' "$work/identities.txt" | grep -q .; then
            status failure "提交身份不是 DeepSeek Harness <dsh@chamo.invalid>"; exit 0
          fi
          { grep -E '^\+' "$work/diff.patch" | grep -vE '^\+\+\+ ' || true
            jq -r '.title + "\n" + (.body // "")' <<< "$pr_json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].commit.message'; } > "$work/published.txt"
          if ! scan < "$work/published.txt" 2> "$work/scan.log"; then
            sed 's/^/  /' "$work/scan.log"
            status failure "隐私扫描命中，已拦截（详情见运行日志）"; exit 0
          fi

          export PR_NUMBER="$PR" PR_SHA="$sha"
          { python3 - scripts/ci/review.md <<'PY'
          import os, re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          print(re.sub(r"\{\{([A-Z_]+)\}\}", lambda m: os.environ.get(m.group(1), m.group(0)), text))
          PY
            printf '\n\n## PR 标题与说明\n\n'; jq -r '.title + "\n\n" + (.body // "")' <<< "$pr_json"
            printf '\n\n## Diff\n\n```diff\n'; cat "$work/diff.patch"; printf '\n```\n'; } > "$work/prompt.md"

          if ! python3 scripts/ci/review_llm.py < "$work/prompt.md" > "$work/review.md"; then
            status error "评审模型调用失败（检查 REVIEW_API_KEY / REVIEW_MODEL）"; exit 1
          fi
          verdict=$(grep -oE '^VERDICT: (APPROVE|REQUEST_CHANGES)[[:space:]]*$' "$work/review.md" | tail -1 | awk '{print $2}')
          { echo "**自动评审**（GitHub Actions，独立于开发 Agent；提交 \`${sha:0:12}\`）"; echo; cat "$work/review.md"; } > "$work/c.md"
          if scan < "$work/c.md" 2>/dev/null; then comment "$work/c.md"; else echo "review text hit the privacy scan; not posted"; fi
          case "$verdict" in
            APPROVE) status success "自动评审通过" ;;
            REQUEST_CHANGES) status failure "自动评审要求修改，见 PR 评论" ;;
            *) status error "评审输出缺少 VERDICT 行"; exit 1 ;;
          esac
