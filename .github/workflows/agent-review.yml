name: agent-review
run-name: Independent review PR ${{ github.event.pull_request.number || inputs.pr }}

# DSH inspects the full source and calls/tests. This job only authenticates its
# report and enforces refs, identity and privacy; it never runs candidate code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: number
      report:
        description: Base64 UTF-8 DSH review JSON (max 24 KB decoded)
        required: false
        type: string
      signature:
        description: Base64 Ed25519 signature of the exact report bytes
        required: false
        type: string
permissions:
  contents: read
  pull-requests: write
  statuses: write
concurrency:
  group: agent-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify independent DSH review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REVIEW_REPORT: ${{ inputs.report }}
          REVIEW_SIGNATURE: ${{ inputs.signature }}
          PRIVACY_KEYWORDS: ${{ secrets.PRIVACY_KEYWORDS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ci/dsh_review.py
