name: Set up the Chamo engine
description: >
  Python 3.12 with the locked dependencies and a real LibreOffice for this
  runner's OS. Shared by the PR gate and the multi-platform matrix so both test
  against exactly the same environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: third_party/requirements.lock

    - name: Install engine dependencies
      shell: bash
      # The lock file itself, so a dependency cannot drift between two runs.
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r third_party/requirements.lock

    # LibreOffice comes from one upstream (download.documentfoundation.org via
    # MirrorBrain, or the distro mirror for apt) and the runner downloads it on
    # every job. That host answered HTTP 500 on 2026-10-22 and the macOS cask
    # download failed after 37 minutes, which failed every engine job at once.
    # A short bounded retry turns that external flake into a normal slow run; it
    # never masks a real failure, because the final attempt still fails the job.
    #
    # Every attempt is bounded. A plain retry loop only helps when the command
    # returns an error: when the download or apt instead *hangs*, the loop never
    # reaches its next iteration and behaves exactly like no retry at all. That is
    # the shape the real incidents took - the ui job sat in this step for 30-40
    # minutes with no output (PR #44 a72b9e5, PR #47 a240980) - so each attempt
    # gets a timeout and a timeout counts as a failed attempt. The last attempt
    # still fails the job, so a genuine breakage is never hidden.
    - name: Install LibreOffice (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # libreoffice-common ships /usr/bin/soffice and the real binary under
      # /usr/lib/libreoffice/program (libreoffice-core only has soffice.bin).
      run: |
        # timeout(1) bounds each attempt so a hung mirror becomes a retryable
        # failure instead of a job that sits here until the runner kills it.
        # Overridable so a test can bound each attempt in seconds instead of
        # waiting out the real 7-minute limit.
        APT_TIMEOUT="${APT_TIMEOUT:-420}"
        for attempt in 1 2 3; do
          if sudo timeout "$APT_TIMEOUT" apt-get update &&
             sudo timeout "$APT_TIMEOUT" apt-get install -y libreoffice-core libreoffice-common libreoffice-impress libreoffice-writer fonts-noto-cjk; then
            break
          fi
          echo "::warning::apt attempt $attempt failed or timed out after ${APT_TIMEOUT}s; retrying in $((attempt * 20))s"
          sudo timeout 120 dpkg --configure -a || true
          sleep $((attempt * 20))
        done
        test -x /usr/bin/soffice || { echo "::error::soffice missing after 3 attempts"; exit 1; }

    - name: Install LibreOffice (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Each attempt is bounded, so a hung download becomes a retryable failure
        # rather than a job that never reaches its next iteration.
        $exe = $null
        $attemptTimeout = 900
        foreach ($attempt in 1..3) {
          $process = Start-Process -FilePath "choco" -ArgumentList "install","libreoffice-fresh","-y","--no-progress" -PassThru -NoNewWindow
          if (-not $process.WaitForExit($attemptTimeout * 1000)) {
            Write-Warning "choco attempt $attempt exceeded ${attemptTimeout}s; stopping it"
            try { $process.Kill() } catch { }
            $process.WaitForExit(30000) | Out-Null
          }
          $exe = Get-ChildItem "C:\Program Files\LibreOffice\program\soffice.exe" -ErrorAction SilentlyContinue
          if ($exe) { break }
          Write-Warning "choco attempt $attempt did not produce soffice.exe; retrying"
          Start-Sleep -Seconds (20 * $attempt)
        }
        if (-not $exe) { Write-Error "LibreOffice install did not produce soffice.exe after 3 attempts"; exit 1 }
        Write-Host "found: $($exe.FullName)"

    - name: Install LibreOffice (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        # The cask is pinned to a version published upstream; skipping the
        # self-update only removes work, it does not change what gets installed.
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        # Each attempt is bounded: the real failure here was a cask download that
        # sat for 37 minutes, which a retry loop alone cannot escape.
        BREW_TIMEOUT=900
        for attempt in 1 2 3; do
          if timeout "$BREW_TIMEOUT" brew install --cask libreoffice; then break; fi
          echo "::warning::brew attempt $attempt failed or timed out after ${BREW_TIMEOUT}s; retrying in $((attempt * 20))s"
          sleep $((attempt * 20))
        done
        if [ ! -x "/Applications/LibreOffice.app/Contents/MacOS/soffice" ]; then
          echo "::error::LibreOffice.app is missing after 3 attempts"
          exit 1
        fi
