name: Set up the Chamo engine
description: >
  Python 3.12 with the locked dependencies and a real LibreOffice for this
  runner's OS. Shared by the PR gate and the multi-platform matrix so both test
  against exactly the same environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: third_party/requirements.lock

    - name: Install engine dependencies
      shell: bash
      # The lock file itself, so a dependency cannot drift between two runs.
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r third_party/requirements.lock

    # LibreOffice comes from one upstream (download.documentfoundation.org via
    # MirrorBrain, or the distro mirror for apt) and the runner downloads it on
    # every job. That host answered HTTP 500 on 2026-10-22 and the macOS cask
    # download failed after 37 minutes, which failed every engine job at once.
    # A short bounded retry turns that external flake into a normal slow run; it
    # never masks a real failure, because the final attempt still fails the job.
    - name: Install LibreOffice (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # libreoffice-common ships /usr/bin/soffice and the real binary under
      # /usr/lib/libreoffice/program (libreoffice-core only has soffice.bin).
      run: |
        for attempt in 1 2 3; do
          if sudo apt-get update &&
             sudo apt-get install -y libreoffice-core libreoffice-common libreoffice-impress libreoffice-writer fonts-noto-cjk; then
            break
          fi
          echo "::warning::apt attempt $attempt failed; retrying in $((attempt * 20))s"
          sleep $((attempt * 20))
        done
        test -x /usr/bin/soffice || { echo "::error::soffice missing after 3 attempts"; exit 1; }

    - name: Install LibreOffice (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = $null
        foreach ($attempt in 1..3) {
          choco install libreoffice-fresh -y --no-progress
          $exe = Get-ChildItem "C:\Program Files\LibreOffice\program\soffice.exe" -ErrorAction SilentlyContinue
          if ($exe) { break }
          Write-Warning "choco attempt $attempt did not produce soffice.exe; retrying"
          Start-Sleep -Seconds (20 * $attempt)
        }
        if (-not $exe) { Write-Error "LibreOffice install did not produce soffice.exe after 3 attempts"; exit 1 }
        Write-Host "found: $($exe.FullName)"

    - name: Install LibreOffice (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        # The cask is pinned to a version published upstream; skipping the
        # self-update only removes work, it does not change what gets installed.
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        for attempt in 1 2 3; do
          if brew install --cask libreoffice; then break; fi
          echo "::warning::brew attempt $attempt failed; retrying in $((attempt * 20))s"
          sleep $((attempt * 20))
        done
        if [ ! -x "/Applications/LibreOffice.app/Contents/MacOS/soffice" ]; then
          echo "::error::LibreOffice.app is missing after 3 attempts"
          exit 1
        fi
